<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Paper">
    <defs>
        <radialGradient id="paperGlow" cx="50%" cy="46%" r="55%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
            <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.16"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="paperSkin" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0%" stop-color="#eaf7ff"/>
            <stop offset="42%" stop-color="#a5dcf7"/>
            <stop offset="100%" stop-color="#2f6fae"/>
        </linearGradient>
        <linearGradient id="paperFinger" x1="0" y1="0" x2="0.6" y2="1">
            <stop offset="0%" stop-color="#eefaff"/>
            <stop offset="55%" stop-color="#8ecdf1"/>
            <stop offset="100%" stop-color="#3b7cb5"/>
        </linearGradient>
        <linearGradient id="paperThumb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#cfeafc"/>
            <stop offset="100%" stop-color="#6db2e0"/>
        </linearGradient>
        <linearGradient id="paperCuff" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2f6fae"/>
            <stop offset="100%" stop-color="#173a63"/>
        </linearGradient>
    </defs>

    <circle cx="256" cy="250" r="234" fill="url(#paperGlow)"/>

    <g transform="translate(-17 -65)">

    <!-- fingers (behind palm) -->
    <rect fill="url(#paperFinger)" stroke="#173a63" stroke-width="10" x="150" y="172" width="38" height="150" rx="19"/>
    <rect fill="url(#paperFinger)" stroke="#173a63" stroke-width="10" x="196" y="142" width="38" height="180" rx="19"/>
    <rect fill="url(#paperFinger)" stroke="#173a63" stroke-width="10" x="242" y="158" width="38" height="164" rx="19"/>
    <rect fill="url(#paperFinger)" stroke="#173a63" stroke-width="10" x="288" y="196" width="34" height="126" rx="17"/>

    <!-- finger tip shines -->
    <rect fill="#ffffff" x="160" y="182" width="18" height="26" rx="9" opacity="0.85"/>
    <rect fill="#ffffff" x="206" y="152" width="18" height="26" rx="9" opacity="0.85"/>
    <rect fill="#ffffff" x="252" y="168" width="18" height="26" rx="9" opacity="0.85"/>
    <rect fill="#ffffff" x="296" y="206" width="16" height="24" rx="8" opacity="0.85"/>

    <!-- palm -->
    <path fill="url(#paperSkin)" stroke="#173a63" stroke-width="10"
        d="M144 322 Q144 288 178 288 L298 288 Q332 288 332 322 L332 428 Q332 460 300 460 L176 460 Q144 460 144 428 Z"/>
    <!-- palm lower shading -->
    <path fill="#5e9fce" opacity="0.5"
        d="M144 396 L332 396 L332 428 Q332 460 300 460 L176 460 Q144 460 144 428 Z"/>
    <!-- creases -->
    <rect fill="#bfe6fb" x="168" y="344" width="96" height="13" rx="6.5"/>
    <rect fill="#bfe6fb" x="168" y="374" width="140" height="13" rx="6.5"/>
    <rect fill="#ffffff" x="168" y="344" width="60" height="5" rx="2.5" opacity="0.8"/>
    <rect fill="#ffffff" x="168" y="374" width="84" height="5" rx="2.5" opacity="0.8"/>

    <!-- thumb out to the side -->
    <rect fill="url(#paperThumb)" stroke="#173a63" stroke-width="10" x="318" y="326" width="82" height="40" rx="20" transform="rotate(-18 322 346)"/>
    <rect fill="#ffffff" x="332" y="334" width="48" height="9" rx="4.5" opacity="0.8" transform="rotate(-18 322 346)"/>

    <!-- cuff -->
    <path fill="url(#paperCuff)" stroke="#173a63" stroke-width="10" stroke-linejoin="round"
        d="M166 500 L346 500 L334 452 L178 452 Z"/>
    <rect fill="#bfe6fb" x="182" y="462" width="148" height="15" rx="7.5"/>

    </g>
</svg>
