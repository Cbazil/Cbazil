<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Branch">
    <defs>
        <radialGradient id="brGlow" cx="50%" cy="46%" r="55%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
            <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.16"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="brSkin" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0%" stop-color="#eaf7ff"/>
            <stop offset="42%" stop-color="#a5dcf7"/>
            <stop offset="100%" stop-color="#2f6fae"/>
        </linearGradient>
        <linearGradient id="brFinger" x1="0" y1="0" x2="0.6" y2="1">
            <stop offset="0%" stop-color="#eefaff"/>
            <stop offset="55%" stop-color="#8ecdf1"/>
            <stop offset="100%" stop-color="#3b7cb5"/>
        </linearGradient>
        <linearGradient id="brCuff" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2f6fae"/>
            <stop offset="100%" stop-color="#173a63"/>
        </linearGradient>
    </defs>

    <circle cx="256" cy="250" r="234" fill="url(#brGlow)"/>

    <g transform="translate(-19 39) rotate(180 256 256)">

    <!-- back of hand: exactly four fingers spread, clear gaps, thumb hidden behind -->
    <rect fill="url(#brFinger)" stroke="#173a63" stroke-width="10" x="140" y="120" width="40" height="190" rx="20"/>
    <rect fill="url(#brFinger)" stroke="#173a63" stroke-width="10" x="192" y="92"  width="40" height="218" rx="20"/>
    <rect fill="url(#brFinger)" stroke="#173a63" stroke-width="10" x="244" y="106" width="40" height="204" rx="20"/>
    <rect fill="url(#brFinger)" stroke="#173a63" stroke-width="10" x="296" y="144" width="38" height="166" rx="19"/>

    <!-- finger tip shines -->
    <rect fill="#ffffff" x="151" y="130" width="18" height="26" rx="9" opacity="0.85"/>
    <rect fill="#ffffff" x="203" y="102" width="18" height="26" rx="9" opacity="0.85"/>
    <rect fill="#ffffff" x="255" y="116" width="18" height="26" rx="9" opacity="0.85"/>
    <rect fill="#ffffff" x="305" y="154" width="17" height="24" rx="8.5" opacity="0.85"/>

    <!-- back of hand -->
    <path fill="url(#brSkin)" stroke="#173a63" stroke-width="10"
        d="M132 320 Q132 286 166 286 L302 286 Q336 286 336 320 L336 432 Q336 462 304 462 L164 462 Q132 462 132 432 Z"/>
    <!-- back-of-hand lower shading -->
    <path fill="#5e9fce" opacity="0.5"
        d="M132 398 L336 398 L336 432 Q336 462 304 462 L164 462 Q132 462 132 432 Z"/>
    <!-- knuckle ridge highlights -->
    <rect fill="#bfe6fb" x="150" y="298" width="168" height="13" rx="6.5"/>
    <rect fill="#bfe6fb" x="150" y="328" width="168" height="11" rx="5.5" opacity="0.85"/>
    <rect fill="#bfe6fb" x="150" y="394" width="168" height="13" rx="6.5"/>
    <rect fill="#ffffff" x="150" y="298" width="104" height="5" rx="2.5" opacity="0.8"/>
    <rect fill="#ffffff" x="150" y="394" width="104" height="5" rx="2.5" opacity="0.8"/>

    <!-- cuff -->
    <path fill="url(#brCuff)" stroke="#173a63" stroke-width="10" stroke-linejoin="round"
        d="M158 500 L342 500 L332 454 L168 454 Z"/>
    <rect fill="#bfe6fb" x="176" y="464" width="148" height="15" rx="7.5"/>

    </g>
</svg>
