<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Scissors">
    <defs>
        <radialGradient id="scGlow" cx="50%" cy="46%" r="55%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
            <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.16"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="scSkin" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0%" stop-color="#eaf7ff"/>
            <stop offset="42%" stop-color="#a5dcf7"/>
            <stop offset="100%" stop-color="#2f6fae"/>
        </linearGradient>
        <linearGradient id="scFinger" x1="0" y1="0" x2="0.6" y2="1">
            <stop offset="0%" stop-color="#eefaff"/>
            <stop offset="55%" stop-color="#8ecdf1"/>
            <stop offset="100%" stop-color="#3b7cb5"/>
        </linearGradient>
        <linearGradient id="scThumb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#cfeafc"/>
            <stop offset="100%" stop-color="#6db2e0"/>
        </linearGradient>
        <linearGradient id="scCuff" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2f6fae"/>
            <stop offset="100%" stop-color="#173a63"/>
        </linearGradient>
    </defs>

    <circle cx="256" cy="250" r="234" fill="url(#scGlow)"/>

    <g transform="translate(59 12) rotate(90 256 256)">

    <!-- index + middle finger in a V -->
    <rect fill="url(#scFinger)" stroke="#173a63" stroke-width="10" x="156" y="150" width="38" height="180" rx="19" transform="rotate(-14 175 320)"/>
    <rect fill="url(#scFinger)" stroke="#173a63" stroke-width="10" x="224" y="130" width="38" height="200" rx="19" transform="rotate(12 243 320)"/>

    <!-- finger tip shines -->
    <rect fill="#ffffff" x="170" y="160" width="18" height="26" rx="9" opacity="0.85" transform="rotate(-14 175 320)"/>
    <rect fill="#ffffff" x="238" y="140" width="18" height="26" rx="9" opacity="0.85" transform="rotate(12 243 320)"/>

    <!-- palm -->
    <path fill="url(#scSkin)" stroke="#173a63" stroke-width="10"
        d="M144 322 Q144 288 178 288 L298 288 Q332 288 332 322 L332 428 Q332 460 300 460 L176 460 Q144 460 144 428 Z"/>
    <!-- palm lower shading -->
    <path fill="#5e9fce" opacity="0.5"
        d="M144 396 L332 396 L332 428 Q332 460 300 460 L176 460 Q144 460 144 428 Z"/>

    <!-- folded ring + pinky knuckles -->
    <rect fill="url(#scFinger)" stroke="#173a63" stroke-width="8" x="280" y="294" width="58" height="26" rx="13"/>
    <rect fill="url(#scFinger)" stroke="#173a63" stroke-width="8" x="286" y="324" width="50" height="24" rx="12"/>
    <rect fill="#ffffff" x="288" y="300" width="34" height="7" rx="3.5" opacity="0.8"/>
    <rect fill="#ffffff" x="294" y="330" width="28" height="6" rx="3" opacity="0.8"/>

    <!-- thumb across palm + crease -->
    <rect fill="url(#scThumb)" stroke="#173a63" stroke-width="9" x="172" y="350" width="118" height="32" rx="16"/>
    <rect fill="#ffffff" x="184" y="357" width="80" height="8" rx="4" opacity="0.8"/>
    <rect fill="#bfe6fb" x="172" y="398" width="118" height="12" rx="6"/>

    <!-- cuff -->
    <path fill="url(#scCuff)" stroke="#173a63" stroke-width="10" stroke-linejoin="round"
        d="M166 500 L346 500 L334 452 L178 452 Z"/>
    <rect fill="#bfe6fb" x="182" y="462" width="148" height="15" rx="7.5"/>

    </g>
</svg>
